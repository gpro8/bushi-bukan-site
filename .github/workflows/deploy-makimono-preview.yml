name: Deploy makimono preview

on:
  push:
    branches: [design/makimono]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-makimono-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist under /makimono/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: makimono
          keep_files: true
          force_orphan: false
          user_name: gpro8
          user_email: 272957896+gpro8@users.noreply.github.com
